<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2B1A12">
<title>DEM CAFE · Yönetim Paneli</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/admin.css?v={{V}}">
<script src="/admin.js?v={{V}}" defer></script>
</head>
<body>

<!-- Giriş -->
<section id="login" class="login" hidden>
  <form class="login-card" id="login-form" autocomplete="on">
    <img src="/logo.svg" alt="" width="64" height="64">
    <h1>DEM CAFE</h1>
    <p class="muted">Yönetim Paneli</p>
    <label>Kullanıcı adı<input name="username" autocomplete="username" required autocapitalize="none" spellcheck="false"></label>
    <label>Parola<input name="password" type="password" autocomplete="current-password" required></label>
    <div class="err" id="login-err" role="alert"></div>
    <button class="btn primary block" type="submit">Giriş yap</button>
  </form>
</section>

<!-- Panel -->
<div id="app" class="app" hidden>
  <aside class="side">
    <div class="side-brand"><img src="/logo.svg" alt="" width="36" height="36"><div><b>DEM CAFE</b><span>Yönetim</span></div></div>
    <nav class="tabs" id="tabs">
      <button data-tab="products" class="on"><svg viewBox="0 0 24 24"><path d="M4 8h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8Zm13 1h1.5a2.5 2.5 0 0 1 0 5H17M7 3v2m4-2v2"/></svg><span>Ürünler</span></button>
      <button data-tab="categories"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span>Kategoriler</span></button>
      <button data-tab="announcements"><svg viewBox="0 0 24 24"><path d="M4 10v4a1 1 0 0 0 1 1h2l5 4V5L7 9H5a1 1 0 0 0-1 1Zm12-2a5 5 0 0 1 0 8"/></svg><span>Duyurular</span></button>
      <button data-tab="qr"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v1M14 20h1M18 18h3v3"/></svg><span>QR Kodlar</span></button>
      <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg><span>Ayarlar</span></button>
    </nav>
    <div class="side-foot">
      <a href="/" target="_blank" rel="noopener" class="btn ghost sm">Menüyü gör ↗</a>
      <button class="btn ghost sm" id="logout">Çıkış</button>
    </div>
  </aside>

  <main class="content">
    <header class="topbar">
      <h1 id="view-title">Ürünler</h1>
      <div class="topbar-act" id="view-actions"></div>
    </header>
    <div id="view"></div>
  </main>
</div>

<!-- Modal -->
<div class="modal-wrap" id="modal" hidden>
  <div class="modal-bg" data-close></div>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header class="modal-h"><h2 id="modal-title"></h2><button class="icon-btn" data-close aria-label="Kapat">×</button></header>
    <div class="modal-b" id="modal-body"></div>
    <footer class="modal-f" id="modal-foot"></footer>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
