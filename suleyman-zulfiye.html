<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Süleyman ve Zülfiye</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<style>
/* Layout: one full-screen night scene; story captions float at the top, controls in the corners. */
:root {
  --night: #0b0d26;
  --horizon: #6b2f5c;
  --rose: #ff6f91;
  --moon: #ffe9b0;
  --ink: #f8eef6;
  --muted: #c9b5d6;
  --glass: rgba(20, 12, 40, 0.55);
  --font-script: "Great Vibes", "Brush Script MT", "Segoe Script", cursive;
  --font-body: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

.caption {
  position: fixed; left: 0; right: 0;
  top: calc(env(safe-area-inset-top, 0px) + 6vh);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  text-align: center;
  font-style: italic;
  font-size: clamp(1.25rem, 3.6vw, 2.1rem);
  line-height: 1.3;
  text-wrap: balance;
  text-shadow: 0 0 18px rgba(255, 111, 145, 0.55), 0 2px 6px rgba(0, 0, 0, 0.6);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 1.1s ease, transform 1.1s ease;
  pointer-events: none;
}
.caption.show { opacity: 1; transform: none; }
.caption.script {
  font-family: var(--font-script);
  font-style: normal;
  font-size: clamp(2.6rem, 8vw, 4.6rem);
  color: #ffd3de;
}

.overlay {
  position: fixed; inset: 0;
  display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
  background: radial-gradient(ellipse at 50% 60%, rgba(107, 47, 92, 0.35), rgba(11, 13, 38, 0.82) 70%);
  transition: opacity 0.9s ease;
}
.overlay.fade { opacity: 0; pointer-events: none; }
.card { display: grid; gap: 14px; justify-items: center; text-align: center; max-width: 34rem; }
.card h1 {
  margin: 0;
  font-family: var(--font-script);
  font-weight: 400;
  font-size: clamp(3rem, 11vw, 5.6rem);
  line-height: 1.05;
  text-wrap: balance;
  color: #ffe3ea;
  text-shadow: 0 0 28px rgba(255, 111, 145, 0.6);
}
.card h1 .amp { color: var(--rose); padding-inline: 0.12em; }
.card p { margin: 0; font-size: clamp(1.05rem, 2.6vw, 1.3rem); color: var(--muted); font-style: italic; }
.card .hint { font-size: 0.95rem; letter-spacing: 0.06em; font-style: normal; }

.btn {
  font: 600 1.15rem/1 var(--font-body);
  letter-spacing: 0.04em;
  color: #2a0f22;
  background: linear-gradient(180deg, #ffd1dc, var(--rose));
  border: 0; border-radius: 999px;
  padding: 14px 30px;
  cursor: pointer;
  box-shadow: 0 0 0 0 rgba(255, 111, 145, 0.5), 0 8px 28px rgba(255, 111, 145, 0.35);
  animation: breathe 2.4s ease-in-out infinite;
}
.btn:hover { filter: brightness(1.06); }
.btn:focus-visible { outline: 2px solid var(--moon); outline-offset: 4px; }
@keyframes breathe { 50% { box-shadow: 0 0 0 10px rgba(255, 111, 145, 0), 0 8px 28px rgba(255, 111, 145, 0.5); } }

.corner {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  right: max(12px, env(safe-area-inset-right, 0px));
  font: 500 0.95rem/1 var(--font-body);
  color: var(--ink);
  background: var(--glass);
  border: 1px solid rgba(255, 211, 222, 0.25);
  border-radius: 999px;
  padding: 9px 14px;
  cursor: pointer;
  backdrop-filter: blur(6px);
}
.corner:focus-visible { outline: 2px solid var(--moon); outline-offset: 3px; }

.replay {
  position: fixed; left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 5vh);
  transform: translateX(-50%);
  animation: none;
}

@media (prefers-reduced-motion: reduce) {
  .btn { animation: none; }
  .caption { transition: opacity 0.6s ease; transform: none; }
}
</style>

<canvas id="scene" aria-label="Süleyman ile Zülfiye'nin aşk hikâyesini anlatan animasyon"></canvas>
<div id="caption" class="caption" aria-live="polite"></div>
<button id="mute" class="corner" type="button" hidden>Ses: Açık</button>
<button id="replay" class="btn replay" type="button" hidden>Yeniden izle</button>

<div id="intro" class="overlay">
  <div class="card">
    <p>Bir aşk hikâyesi</p>
    <h1>Süleyman<span class="amp">&amp;</span>Zülfiye</h1>
    <p>Yıldızların altında başlayan bir yolculuk.</p>
    <button id="start" class="btn" type="button">Başlat</button>
    <p class="hint">Sesi açmayı unutma · yaklaşık 1 dakika</p>
  </div>
</div>

<script>
(() => {
  'use strict';
  const cv = document.getElementById('scene');
  const ctx = cv.getContext('2d');
  const capEl = document.getElementById('caption');
  const intro = document.getElementById('intro');
  const startBtn = document.getElementById('start');
  const muteBtn = document.getElementById('mute');
  const replayBtn = document.getElementById('replay');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- helpers ----------
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, k) => a + (b - a) * k;
  const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
  const easeIO = k => k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
  const easeOut = k => 1 - Math.pow(1 - k, 3);
  function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const R = rng(1453);

  function heartPath(c, x, y, s) {
    c.beginPath();
    for (let i = 0; i <= 64; i++) {
      const a = (i / 64) * Math.PI * 2;
      const hx = 16 * Math.pow(Math.sin(a), 3);
      const hy = 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a);
      const px = x + hx * s / 16, py = y - hy * s / 16;
      i ? c.lineTo(px, py) : c.moveTo(px, py);
    }
    c.closePath();
  }

  // ---------- timeline (seconds) ----------
  const T = { walk: 5, meet: 15, bloom: 22, text: 30, fire: 33, final: 40, replay: 48 };
  const STEP = 0.5;
  const BEAT = 0.9;
  const CAPTIONS = [
    [0.8, 4.6, "Bir zamanlar, yıldızların altında…"],
    [5.4, 9.8, "Süleyman'ın kalbi tek bir isim için atıyordu."],
    [10.3, 14.6, "O isim, yolun öbür ucundan ona doğru geliyordu."],
    [15.4, 21.4, "Zülfiye", true],
    [22.4, 29.2, "Onun için bütün çiçekler açtı."],
    [30.4, 38.6, "Gökyüzü bile adlarını yazdı."],
    [39.6, 1e9, "Seni seviyorum Zülfiye. Sonsuza dek."]
  ];

  // ---------- static world data ----------
  const stars = Array.from({ length: 240 }, () => ({ x: R(), y: Math.pow(R(), 1.4) * 0.72, r: 0.3 + R() * 1.3, p: R() * 6.28, s: 0.6 + R() * 2 }));
  const shooting = [2.4, 12.2, 26.5].map(t0 => ({ t0, x: 0.15 + R() * 0.5, y: 0.05 + R() * 0.15 }));

  const flowerU = [0.04, 0.09, 0.13, 0.18, 0.23, 0.28, 0.33, 0.67, 0.72, 0.77, 0.82, 0.87, 0.91, 0.96];
  const petalCols = ['#ff6f91', '#ffb3c6', '#ffd27a', '#c9a0ff', '#ff8fa8', '#fff1f5'];
  const flowers = flowerU
    .map(u => ({ u, d: Math.abs(u - 0.5), col: petalCols[Math.floor(R() * petalCols.length)], size: 0.7 + R() * 0.6, len: 0.6 + R() * 0.5, off: (R() - 0.5) * 0.012 }))
    .sort((a, b) => a.d - b.d)
    .map((f, i) => Object.assign(f, { tb: T.bloom + 0.3 + i * 0.42 }));

  const fwCols = ['#ff6f91', '#ffd27a', '#ffffff', '#c9a0ff', '#7fd6ff', '#ffb3c6'];
  const fireworks = [33, 34.2, 35.0, 36.3, 37.1, 38.4, 39.2, 40.3, 41.2, 42.6, 43.7, 45.2, 46.6, 48.4, 50.2].map((lt, i) => ({
    lt, te: lt + 1.05,
    x0: 0.2 + R() * 0.6, x1: 0.1 + R() * 0.8, y1: 0.08 + R() * 0.17,
    col: fwCols[i % fwCols.length], col2: fwCols[(i + 2) % fwCols.length],
    heart: i % 3 === 1, n: 70, seed: Math.floor(R() * 1e6)
  }));
  fireworks.forEach(f => {
    const r = rng(f.seed);
    f.parts = Array.from({ length: f.n }, (_, i) => {
      if (f.heart) {
        const a = (i / f.n) * Math.PI * 2;
        return { dx: Math.pow(Math.sin(a), 3), dy: -(13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) / 16, s: 1 };
      }
      const a = (i / f.n) * Math.PI * 2 + r() * 0.2;
      return { dx: Math.cos(a), dy: Math.sin(a), s: 0.55 + r() * 0.45 };
    });
  });

  // ---------- layout ----------
  let W = 0, H = 0, DPR = 1, fh = 100, gap = 30;
  let textPts = [];
  const particles = [];
  const PCOUNT = 2600;

  function groundY(x) { return H * 0.81 - H * 0.065 * Math.sin(Math.PI * clamp(x / W, 0, 1)); }

  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    fh = Math.min(H * 0.2, W * 0.3);
    gap = fh * 0.3;
    buildText();
  }

  function buildText() {
    const oc = document.createElement('canvas');
    oc.width = Math.max(1, Math.floor(W)); oc.height = Math.max(1, Math.floor(H));
    const o = oc.getContext('2d');
    const cy = H * 0.36;
    let fs = Math.min(H * 0.12, 150);
    o.font = `${fs}px "Great Vibes", "Brush Script MT", cursive`;
    const wMax = Math.max(o.measureText('Süleyman').width, o.measureText('Zülfiye').width);
    if (wMax > W * 0.86) fs *= (W * 0.86) / wMax;
    o.font = `${fs}px "Great Vibes", "Brush Script MT", cursive`;
    o.fillStyle = '#fff'; o.textAlign = 'center'; o.textBaseline = 'middle';
    o.fillText('Süleyman', W / 2, cy - fs * 0.78);
    o.fillText('Zülfiye', W / 2, cy + fs * 0.82);
    heartPath(o, W / 2, cy, fs * 0.28); o.fill();
    const data = o.getImageData(0, 0, oc.width, oc.height).data;
    const sample = step => { const a = []; for (let y = 0; y < oc.height; y += step) for (let x = 0; x < oc.width; x += step) if (data[(y * oc.width + x) * 4 + 3] > 128) a.push([x, y]); return a; };
    let pts = sample(2);
    const want = Math.sqrt(pts.length * 4 / PCOUNT);
    if (want > 2.4) pts = sample(Math.round(want));
    const r = rng(77);
    for (let i = pts.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [pts[i], pts[j]] = [pts[j], pts[i]]; }
    textPts = pts.length ? pts : [[W / 2, cy]];
  }

  (function initParticles() {
    const r = rng(2024);
    for (let i = 0; i < PCOUNT; i++) particles.push({ d: r() * 1.4, dur: 1.8 + r() * 1.2, sx: (r() - 0.5), sy: (r() - 0.5), cx: (r() - 0.5) * 2, cy: (r() - 0.5) * 2, ph: r() * 6.28, hue: r() });
  })();

  // ---------- drawing ----------
  function drawSky(t) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#07081d'); g.addColorStop(0.45, '#151a45'); g.addColorStop(0.72, '#4a2459'); g.addColorStop(0.86, '#8a3c66'); g.addColorStop(1, '#2a1233');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    const fade = 0.35 + 0.65 * seg(t, 0, 3);
    for (const s of stars) {
      const tw = reduced ? 0.8 : 0.55 + 0.45 * Math.sin(t * s.s + s.p);
      ctx.globalAlpha = fade * tw * 0.9;
      ctx.fillStyle = '#fff6e8';
      ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (const s of shooting) {
      const k = (t - s.t0) / 0.9;
      if (k < 0 || k > 1) continue;
      const x = (s.x + k * 0.35) * W, y = (s.y + k * 0.16) * H;
      const tg = ctx.createLinearGradient(x, y, x - W * 0.12, y - H * 0.055);
      tg.addColorStop(0, `rgba(255,255,255,${1 - k})`); tg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = tg; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - W * 0.12, y - H * 0.055); ctx.stroke();
    }

    // moon
    const mr = Math.min(W, H) * 0.065;
    const mx = W * 0.8, my = H * 0.2 + (1 - easeOut(seg(t, 0, 4))) * H * 0.08;
    const halo = ctx.createRadialGradient(mx, my, mr * 0.8, mx, my, mr * 4.5);
    halo.addColorStop(0, 'rgba(255,233,176,0.35)'); halo.addColorStop(1, 'rgba(255,233,176,0)');
    ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(mx, my, mr * 4.5, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#ffe9b0'; ctx.beginPath(); ctx.arc(mx, my, mr, 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(214,180,120,0.35)';
    [[-0.3, -0.2, 0.18], [0.25, 0.15, 0.13], [-0.05, 0.38, 0.1]].forEach(([a, b, c]) => { ctx.beginPath(); ctx.arc(mx + a * mr, my + b * mr, c * mr, 0, 6.283); ctx.fill(); });
  }

  function drawHills() {
    // far hills
    ctx.fillStyle = '#3a1a49';
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 12) ctx.lineTo(x, H * 0.74 - H * 0.04 * Math.sin(x / W * 5.2 + 1) - H * 0.025 * Math.sin(x / W * 11));
    ctx.lineTo(W, H); ctx.fill();
    // main hill
    const g = ctx.createLinearGradient(0, H * 0.72, 0, H);
    g.addColorStop(0, '#1d0f2c'); g.addColorStop(1, '#0c0716');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 8) ctx.lineTo(x, groundY(x));
    ctx.lineTo(W, H); ctx.fill();
    ctx.strokeStyle = 'rgba(255,150,180,0.18)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); for (let x = 0; x <= W; x += 8) x ? ctx.lineTo(x, groundY(x)) : ctx.moveTo(x, groundY(x)); ctx.stroke();
  }

  function drawFlowers(t) {
    for (const f of flowers) {
      if (t < f.tb) continue;
      const x = (f.u + f.off) * W, y = groundY(x) + 2;
      const s = fh * 0.07 * f.size;
      const grow = easeOut(seg(t, f.tb, f.tb + 1.1));
      const open = easeOut(seg(t, f.tb + 0.6, f.tb + 1.7));
      const sway = Math.sin(t * 1.4 + f.u * 20) * 0.08;
      const len = fh * 0.32 * f.len * grow;
      const tx = x + Math.sin(sway) * len, ty = y - Math.cos(sway) * len;
      ctx.strokeStyle = '#3f7a4f'; ctx.lineWidth = Math.max(1.2, fh * 0.012); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + sway * len * 0.3, y - len * 0.5, tx, ty); ctx.stroke();
      if (grow > 0.4) {
        ctx.fillStyle = '#4f9462';
        ctx.beginPath(); ctx.ellipse(x + s * 0.6, y - len * 0.35, s * 0.55 * grow, s * 0.22 * grow, -0.6, 0, 6.283); ctx.fill();
      }
      if (open > 0) {
        ctx.save(); ctx.translate(tx, ty); ctx.rotate(t * 0.2 + f.u * 9);
        ctx.shadowColor = f.col; ctx.shadowBlur = 12 * open;
        ctx.fillStyle = f.col;
        for (let i = 0; i < 5; i++) { ctx.rotate(Math.PI * 2 / 5); ctx.beginPath(); ctx.ellipse(s * 0.75 * open, 0, s * 0.75 * open, s * 0.42 * open, 0, 0, 6.283); ctx.fill(); }
        ctx.shadowBlur = 0; ctx.fillStyle = '#ffd27a';
        ctx.beginPath(); ctx.arc(0, 0, s * 0.35 * open, 0, 6.283); ctx.fill();
        ctx.restore();
      }
    }
  }

  function person(x, gy, h, o) {
    const r = h * 0.085, lw = h * 0.055;
    const bob = Math.abs(Math.sin(o.phase)) * o.amp * h * 0.03;
    gy -= bob;
    const hipY = gy - h * 0.47, shY = gy - h * 0.78, headY = gy - h + r;
    const legLen = h * 0.47, armLen = h * 0.33;
    ctx.save();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.fillStyle = ctx.strokeStyle = '#150b22';
    ctx.shadowColor = o.glow; ctx.shadowBlur = h * 0.09;
    ctx.lineWidth = lw;
    // legs
    for (const s of [1, -1]) {
      const a = Math.sin(o.phase) * o.amp * s * 0.5;
      ctx.beginPath(); ctx.moveTo(x, hipY); ctx.lineTo(x + Math.sin(a) * legLen, hipY + Math.cos(a) * legLen); ctx.stroke();
    }
    // back arm
    {
      const a = -Math.sin(o.phase) * o.amp * 0.6 * o.dir;
      ctx.beginPath(); ctx.moveTo(x, shY + lw * 0.3); ctx.lineTo(x + Math.sin(a) * armLen, shY + lw * 0.3 + Math.cos(a) * armLen); ctx.stroke();
    }
    // body
    ctx.beginPath();
    if (o.female) {
      const hem = gy - h * 0.17, sw = Math.sin(o.time * 1.6) * h * 0.012;
      ctx.moveTo(x - h * 0.07, shY); ctx.lineTo(x + h * 0.07, shY);
      ctx.lineTo(x + h * 0.18 + sw, hem); ctx.quadraticCurveTo(x, hem + h * 0.035, x - h * 0.18 + sw, hem);
    } else {
      ctx.moveTo(x - h * 0.1, shY); ctx.lineTo(x + h * 0.1, shY);
      ctx.lineTo(x + h * 0.075, hipY + h * 0.02); ctx.lineTo(x - h * 0.075, hipY + h * 0.02);
    }
    ctx.closePath(); ctx.fill();
    // neck + head
    ctx.beginPath(); ctx.moveTo(x, shY); ctx.lineTo(x, headY + r); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, headY, r, 0, 6.283); ctx.fill();
    if (o.female) {
      const wave = Math.sin(o.time * 2.1) * h * 0.02;
      ctx.beginPath();
      ctx.moveTo(x + o.dir * r * 0.8, headY - r * 0.7);
      ctx.quadraticCurveTo(x - o.dir * r * 1.6, headY - r * 1.5, x - o.dir * r * 1.5 + wave, shY + h * 0.06);
      ctx.quadraticCurveTo(x - o.dir * r * 0.2, shY - h * 0.02, x, headY);
      ctx.closePath(); ctx.fill();
      // little flower in her hair
      ctx.shadowBlur = 8; ctx.shadowColor = '#ff6f91'; ctx.fillStyle = '#ff6f91';
      ctx.beginPath(); ctx.arc(x - o.dir * r * 0.6, headY - r * 0.75, r * 0.28, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#150b22'; ctx.shadowColor = o.glow; ctx.shadowBlur = h * 0.09;
    } else {
      ctx.beginPath(); ctx.arc(x - o.dir * r * 0.15, headY - r * 0.25, r * 1.05, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();
    }
    // front arm (reaches toward partner)
    {
      const swing = Math.sin(o.phase) * o.amp * 0.6 * o.dir;
      const reachA = o.dir * (Math.PI / 2 - 0.35);
      const a = lerp(swing, reachA, easeIO(o.reach));
      ctx.beginPath(); ctx.moveTo(x, shY + lw * 0.3); ctx.lineTo(x + Math.sin(a) * armLen, shY + lw * 0.3 + Math.cos(a) * armLen); ctx.stroke();
    }
    ctx.restore();
  }

  function heartPulse(t) {
    if (t < T.meet) return 0;
    const l = ((t - T.meet - 0.3) % BEAT + BEAT) % BEAT;
    return Math.exp(-l * 10) + 0.6 * (l > 0.22 ? Math.exp(-(l - 0.22) * 10) : 0);
  }

  function heartPos() { return { x: W / 2, y: groundY(W / 2) - fh * 1.38 }; }

  function drawCouple(t) {
    if (t < T.walk - 0.2) return;
    const p = seg(t, T.walk, T.meet);
    const walkK = 1 - Math.pow(1 - p, 1.6);
    const walking = t < T.meet;
    const phase = (t - T.walk) / STEP * Math.PI;
    const amp = walking ? 0.9 * Math.min(1, (T.meet - t) / 0.8) : 0;
    const reach = seg(t, T.meet - 0.3, T.meet + 1.4);
    const sway = t > T.meet ? Math.sin((t - T.meet) * 0.9) * fh * 0.01 : 0;
    const xS = lerp(-W * 0.12, W / 2 - gap, walkK) + sway;
    const xZ = lerp(W * 1.12, W / 2 + gap, walkK) + sway;
    const glowK = 0.35 + 0.4 * seg(t, T.meet, T.meet + 2);
    person(xS, groundY(xS), fh, { dir: 1, phase, amp, reach, time: t, glow: `rgba(127,190,255,${glowK})` });
    person(xZ, groundY(xZ), fh * 0.93, { dir: -1, phase: phase + Math.PI, amp, reach, time: t, female: true, glow: `rgba(255,120,160,${glowK})` });
  }

  function drawHeart(t) {
    if (t < T.meet + 0.3 || t > T.text + 0.6) return;
    const { x, y } = heartPos();
    const grow = easeOut(seg(t, T.meet + 0.3, T.meet + 2.2));
    const burst = seg(t, T.text, T.text + 0.5);
    const s = fh * 0.2 * grow * (1 + 0.12 * heartPulse(t)) * (1 + burst * 1.2);
    ctx.save();
    ctx.globalAlpha = 1 - burst;
    const glow = ctx.createRadialGradient(x, y, 0, x, y, s * 3);
    glow.addColorStop(0, 'rgba(255,111,145,0.45)'); glow.addColorStop(1, 'rgba(255,111,145,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x, y, s * 3, 0, 6.283); ctx.fill();
    const hg = ctx.createLinearGradient(x, y - s, x, y + s);
    hg.addColorStop(0, '#ff9ab4'); hg.addColorStop(1, '#e8335f');
    ctx.fillStyle = hg; ctx.shadowColor = '#ff6f91'; ctx.shadowBlur = 25;
    heartPath(ctx, x, y, s); ctx.fill();
    ctx.restore();
    if (burst > 0 && burst < 1) {
      ctx.strokeStyle = `rgba(255,220,230,${1 - burst})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, y, fh * 0.2 + burst * Math.min(W, H) * 0.5, 0, 6.283); ctx.stroke();
    }
  }

  function drawTextParticles(t) {
    if (t < T.text) return;
    const { x: hx, y: hy } = heartPos();
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const n = Math.min(PCOUNT, textPts.length * 2);
    for (let i = 0; i < n; i++) {
      const pa = particles[i];
      const [tx, ty] = textPts[i % textPts.length];
      const k = easeIO(seg(t, T.text + pa.d, T.text + pa.d + pa.dur));
      const sx = hx + pa.sx * fh * 0.4, sy = hy + pa.sy * fh * 0.4;
      const cx = lerp(sx, tx, 0.5) + pa.cx * W * 0.25, cy = lerp(sy, ty, 0.5) + pa.cy * H * 0.2;
      const u = 1 - k;
      const x = u * u * sx + 2 * u * k * cx + k * k * tx;
      const y = u * u * sy + 2 * u * k * cy + k * k * ty;
      const tw = reduced ? 1 : 0.7 + 0.3 * Math.sin(t * 3 + pa.ph);
      const r = (k < 1 ? 1.6 : 1.3) * tw;
      ctx.fillStyle = pa.hue < 0.65 ? `rgba(255,120,155,${0.8 * tw})` : `rgba(255,214,140,${0.8 * tw})`;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
    }
    ctx.restore();
  }

  function drawFireworks(t) {
    if (t < T.fire - 0.1) return;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const R0 = Math.min(W, H) * 0.17, G = H * 0.06;
    for (const f of fireworks) {
      const ex = f.x1 * W, ey = f.y1 * H;
      if (t >= f.lt && t < f.te) {
        const k = easeOut(seg(t, f.lt, f.te));
        const x = lerp(f.x0 * W, ex, k), y = lerp(H, ey, k);
        ctx.fillStyle = '#fff1d6'; ctx.beginPath(); ctx.arc(x, y, 2.2, 0, 6.283); ctx.fill();
        for (let j = 1; j < 8; j++) {
          const kk = easeOut(seg(t - j * 0.03, f.lt, f.te));
          ctx.fillStyle = `rgba(255,200,140,${0.5 - j * 0.06})`;
          ctx.beginPath(); ctx.arc(lerp(f.x0 * W, ex, kk), lerp(H, ey, kk), 1.6, 0, 6.283); ctx.fill();
        }
      }
      const a = t - f.te;
      if (a < 0 || a > 2.4) continue;
      if (a < 0.15) {
        ctx.fillStyle = `rgba(255,255,255,${0.35 * (1 - a / 0.15)})`;
        ctx.beginPath(); ctx.arc(ex, ey, R0 * 0.5, 0, 6.283); ctx.fill();
      }
      const alpha = Math.max(0, 1 - a / 2.4);
      for (let i = 0; i < f.parts.length; i++) {
        const p = f.parts[i];
        for (let j = 0; j < 3; j++) {
          const aa = Math.max(0, a - j * 0.05);
          const d = (1 - Math.exp(-3 * aa)) / (1 - Math.exp(-3 * 2.4));
          const x = ex + p.dx * p.s * R0 * d * 1.1;
          const y = ey + p.dy * p.s * R0 * d * 1.1 + 0.5 * G * aa * aa;
          ctx.fillStyle = (i % 2 ? f.col : f.col2);
          ctx.globalAlpha = alpha * (1 - j * 0.35) * (reduced ? 1 : 0.75 + 0.25 * Math.sin(t * 30 + i));
          ctx.beginPath(); ctx.arc(x, y, 1.8 - j * 0.4, 0, 6.283); ctx.fill();
        }
      }
    }
    ctx.restore();
  }

  const floaters = [];
  let lastSpawn = 0;
  function drawFloaters(t, dt) {
    if (t > T.final && t - lastSpawn > 0.28) {
      lastSpawn = t;
      floaters.push({ x: Math.random() * W, y: H + 20, s: 6 + Math.random() * 10, v: 30 + Math.random() * 40, ph: Math.random() * 6.28, born: t, col: Math.random() < 0.7 ? '#ff6f91' : '#ffd27a' });
    }
    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i];
      f.y -= f.v * dt;
      const x = f.x + Math.sin(t * 1.5 + f.ph) * 18;
      if (f.y < -30) { floaters.splice(i, 1); continue; }
      ctx.globalAlpha = clamp((f.y / H) * 1.2, 0, 0.85) * clamp((t - f.born) * 2, 0, 1);
      ctx.fillStyle = f.col; heartPath(ctx, x, f.y, f.s); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- captions ----------
  let capIdx = -2;
  function updateCaption(t) {
    let idx = -1;
    CAPTIONS.forEach((c, i) => { if (t >= c[0] && t < c[1]) idx = i; });
    if (idx === capIdx) return;
    capIdx = idx;
    capEl.classList.remove('show');
    if (idx >= 0) {
      const c = CAPTIONS[idx];
      setTimeout(() => {
        if (capIdx !== idx) return;
        capEl.textContent = c[2];
        capEl.classList.toggle('script', !!c[3]);
        capEl.classList.add('show');
      }, capEl.textContent ? 450 : 0);
    }
  }

  // ---------- audio ----------
  let ac = null, master = null, run = null, noiseBuf = null, muted = false;
  let aBase = 0, musicTimer = null;

  function initAudio() {
    if (ac) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = 0.9;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4;
    master.connect(comp); comp.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }

  function out(pan) {
    if (pan && ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = pan; p.connect(run); return p; }
    return run;
  }
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const at = t => aBase + t; // story time -> audio time

  function env(g, t, a, peak, dec) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + dec);
  }
  function osc(type, f, t, dur, dest) {
    const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
    o.connect(dest); o.start(t); o.stop(t + dur + 0.05); return o;
  }
  function noise(t, dur, dest) {
    const s = ac.createBufferSource(); s.buffer = noiseBuf; s.connect(dest);
    s.start(t, Math.random() * 1.5); s.stop(t + dur); return s;
  }

  function musicBox(m, t, vol = 0.16, dec = 1.8, pan = 0) {
    const g = ac.createGain(); g.connect(out(pan)); env(g, t, 0.006, vol, dec);
    osc('sine', mtof(m), t, dec + 0.1, g);
    const g2 = ac.createGain(); g2.gain.value = 0.25; g2.connect(g);
    osc('sine', mtof(m) * 3.01, t, dec * 0.5, g2);
  }
  function pluck(m, t, vol = 0.05) {
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1400; f.connect(out());
    const g = ac.createGain(); g.connect(f); env(g, t, 0.015, vol, 1.1);
    osc('triangle', mtof(m), t, 1.2, g);
  }
  function pad(notes, t, dur, vol = 0.02) {
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 700; f.connect(out());
    const g = ac.createGain(); g.connect(f);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.4); g.gain.exponentialRampToValueAtTime(0.0001, t + dur * 1.1);
    notes.forEach((m, i) => { const o = osc('sawtooth', mtof(m), t, dur * 1.1, g); o.detune.value = (i % 2 ? 7 : -7); });
  }
  function footstep(t, pan, pitch) {
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 500 * pitch; f.connect(out(pan));
    const g = ac.createGain(); g.connect(f); env(g, t, 0.004, 0.32, 0.11);
    noise(t, 0.16, g);
    const g2 = ac.createGain(); g2.connect(out(pan)); env(g2, t, 0.004, 0.18, 0.08);
    const o = osc('sine', 110 * pitch, t, 0.12, g2); o.frequency.exponentialRampToValueAtTime(50, t + 0.1);
  }
  function thump(t, vol) {
    const g = ac.createGain(); g.connect(out()); env(g, t, 0.008, vol, 0.2);
    const o = osc('sine', 75, t, 0.25, g); o.frequency.exponentialRampToValueAtTime(38, t + 0.18);
  }
  function heartbeat(t, vol) { thump(t, vol); thump(t + 0.22, vol * 0.65); }
  function chime(m, t, pan) { musicBox(m, t, 0.09, 2.4, pan); musicBox(m + 12, t + 0.06, 0.04, 1.6, pan); }
  function sparkle(t, pan = 0) { [88, 91, 93, 96, 98].forEach((m, i) => musicBox(m, t + i * 0.06, 0.035, 0.6, pan)); }
  function whoosh(t, dur, pan) {
    const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 3;
    f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(3000, t + dur);
    f.connect(out(pan));
    const g = ac.createGain(); g.connect(f);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.14, t + dur * 0.7); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    noise(t, dur + 0.05, g);
  }
  function boom(t, pan) {
    const f = ac.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(2200, t); f.frequency.exponentialRampToValueAtTime(180, t + 1.2); f.connect(out(pan));
    const g = ac.createGain(); g.connect(f); env(g, t, 0.005, 0.5, 1.3);
    noise(t, 1.4, g);
    thump(t, 0.35);
    for (let i = 0; i < 14; i++) {
      const tt = t + 0.35 + Math.random() * 0.9;
      const hf = ac.createBiquadFilter(); hf.type = 'highpass'; hf.frequency.value = 3000; hf.connect(out(pan + (Math.random() - 0.5) * 0.4));
      const cg = ac.createGain(); cg.connect(hf); env(cg, tt, 0.002, 0.06 + Math.random() * 0.06, 0.04);
      noise(tt, 0.06, cg);
    }
  }
  function wind(t0, dur) {
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420; f.connect(out());
    const lfo = ac.createOscillator(); lfo.frequency.value = 0.13;
    const lg = ac.createGain(); lg.gain.value = 180; lfo.connect(lg); lg.connect(f.frequency); lfo.start(t0); lfo.stop(t0 + dur);
    const g = ac.createGain(); g.connect(f);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.05, t0 + 3); g.gain.setValueAtTime(0.05, t0 + dur - 4); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    for (let k = 0; k < dur; k += 1.9) noise(t0 + k, 2, g);
  }

  // music: I – V/3 – vi – IV, music-box melody on top
  const CHORDS = [[48, 55, 60, 64], [47, 55, 59, 62], [45, 52, 57, 60], [41, 48, 53, 57]];
  const ARP = [0, 1, 2, 3, 2, 3, 2, 1];
  const MEL = {};
  [[0, 76, 3], [3, 74, 1], [4, 72, 2], [6, 74, 2], [8, 74, 3], [11, 72, 1], [12, 71, 2], [14, 67, 2],
   [16, 72, 3], [19, 71, 1], [20, 69, 2], [22, 72, 2], [24, 69, 4], [28, 72, 2], [30, 71, 2]].forEach(([e, m, d]) => MEL[e] = [m, d]);
  const MEL2 = {};
  [[0, 79, 3], [3, 77, 1], [4, 76, 2], [6, 79, 2], [8, 79, 2], [10, 76, 2], [12, 74, 4], [16, 76, 3], [19, 74, 1], [20, 72, 2], [22, 76, 2], [24, 77, 2], [26, 76, 2], [28, 74, 4]].forEach(([e, m, d]) => MEL2[e] = [m, d]);
  const EIGHTH = 60 / 66 / 2;
  const MUSIC_START = 0.6;
  const MUSIC_BARS = 15;
  let nextE = 0;

  function scheduleMusic() {
    if (!ac) return;
    while (nextE <= MUSIC_BARS * 8) {
      const st = MUSIC_START + nextE * EIGHTH;
      const time = at(st);
      if (time > ac.currentTime + 0.3) break;
      if (nextE === MUSIC_BARS * 8) {
        [60, 64, 67, 72, 76, 79, 84].forEach((m, i) => musicBox(m, time + i * 0.09, 0.09, 3.5));
        pad([48, 55, 60, 64], time, 6, 0.02);
        nextE++; break;
      }
      if (time >= ac.currentTime - 0.05) {
        const bar = Math.floor(nextE / 8) % 4, w = nextE % 8, chord = CHORDS[bar];
        pluck(chord[ARP[w]] + 12, time, st < T.walk ? 0.03 : 0.045);
        if (w === 0) pluck(chord[0], time, 0.06);
        const phraseE = nextE % 32;
        const useAlt = Math.floor(nextE / 32) % 2 === 1;
        const mel = st > 3.4 ? (useAlt ? MEL2 : MEL)[phraseE] : null;
        if (mel) musicBox(mel[0], time, st > T.final ? 0.17 : 0.13, 0.9 + mel[1] * EIGHTH);
        if (w === 0 && st >= T.meet - 1) pad(chord.map(n => n + 12), time, 8 * EIGHTH, st > T.final - 2 ? 0.028 : 0.02);
      }
      nextE++;
    }
  }

  function scheduleStory() {
    wind(at(0), 58);
    shooting.forEach(s => sparkle(at(s.t0 + 0.2), (s.x - 0.5)));
    for (let t = T.walk + 0.25; t < T.meet - 0.2; t += STEP) {
      footstep(at(t), -0.5 + (t - T.walk) / 20, 0.9);
      footstep(at(t + 0.08), 0.5 - (t - T.walk) / 20, 1.25);
    }
    for (let t = T.meet + 0.3; t < T.text; t += BEAT) heartbeat(at(t), t < T.meet + 2 ? 0.35 + (t - T.meet) * 0.12 : 0.55);
    sparkle(at(T.meet + 0.4)); sparkle(at(T.meet + 1.2));
    const PENTA = [72, 74, 76, 79, 81, 84, 86, 88, 91, 93, 96, 98, 100, 103];
    flowers.forEach((f, i) => chime(PENTA[i % PENTA.length], at(f.tb + 0.6), (f.u - 0.5) * 1.4));
    whoosh(at(T.text - 0.1), 0.6, 0);
    sparkle(at(T.text + 0.2)); sparkle(at(T.text + 1.4), -0.4); sparkle(at(T.text + 2.6), 0.4);
    fireworks.forEach(f => { const pan = (f.x1 - 0.5) * 1.4; whoosh(at(f.lt), f.te - f.lt, pan); boom(at(f.te), pan); });
  }

  function startAudioRun() {
    if (!ac) return;
    if (run) { try { run.gain.cancelScheduledValues(ac.currentTime); run.gain.setTargetAtTime(0, ac.currentTime, 0.05); const old = run; setTimeout(() => old.disconnect(), 400); } catch (e) {} }
    run = ac.createGain(); run.connect(master);
    aBase = ac.currentTime + 0.12;
    nextE = 0;
    scheduleStory();
    scheduleMusic();
    clearInterval(musicTimer);
    musicTimer = setInterval(scheduleMusic, 60);
  }

  // ---------- loop ----------
  let playing = false, pBase = 0, lastT = 0, lastFrame = performance.now();
  function storyTime() { return playing ? (performance.now() - pBase) / 1000 : 0; }

  function frame(now) {
    const dt = Math.min(0.05, (now - lastFrame) / 1000); lastFrame = now;
    const t = storyTime();
    ctx.clearRect(0, 0, W, H);
    drawSky(playing ? t : 4);
    drawFireworks(t);
    drawHills();
    drawFlowers(t);
    drawCouple(t);
    drawHeart(t);
    drawTextParticles(t);
    drawFloaters(t, dt);
    if (playing) {
      updateCaption(t);
      if (t > T.replay && replayBtn.hidden) replayBtn.hidden = false;
    }
    lastT = t;
    requestAnimationFrame(frame);
  }

  async function start() {
    initAudio();
    if (ac && ac.state === 'suspended') { try { await ac.resume(); } catch (e) {} }
    floaters.length = 0; lastSpawn = 0; capIdx = -2;
    capEl.classList.remove('show'); capEl.textContent = '';
    replayBtn.hidden = true;
    startAudioRun();
    pBase = performance.now() + 120;
    playing = true;
    intro.classList.add('fade');
    muteBtn.hidden = !ac;
  }

  startBtn.addEventListener('click', start);
  replayBtn.addEventListener('click', start);
  muteBtn.addEventListener('click', () => {
    if (!ac) return;
    muted = !muted;
    master.gain.setTargetAtTime(muted ? 0 : 0.9, ac.currentTime, 0.05);
    muteBtn.textContent = muted ? 'Ses: Kapalı' : 'Ses: Açık';
  });

  window.addEventListener('resize', resize);
  resize();
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load('80px "Great Vibes"'), document.fonts.load('italic 20px "Cormorant Garamond"')]).then(buildText, () => {});
  }
  requestAnimationFrame(frame);
})();
</script>

</html>
