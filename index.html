<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="canonical" href="{{CANON}}">
<meta name="theme-color" content="#2B1A12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:type" content="website">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{CANON}}">
<meta property="og:image" content="{{CANON}}og.png">
<meta property="og:locale" content="tr_TR">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/app.css?v={{V}}">
<script type="application/ld+json">{{JSONLD}}</script>
<script id="menu-data" type="application/json">{{DATA}}</script>
<script src="/app.js?v={{V}}" defer></script>
</head>
<body>
<div id="splash" class="splash" aria-hidden="true">
  <img src="/logo.svg" alt="" width="96" height="96" class="splash-logo">
  <div class="splash-name">DEM CAFE</div>
  <div class="splash-slogan" id="splash-slogan">Her Yudumda Bir DEM</div>
</div>

<header class="hero">
  <div class="hero-top">
    <span class="table-chip" id="table-chip" hidden></span>
    <div class="lang" role="group" aria-label="Dil / Language">
      <button type="button" data-lang="tr" aria-pressed="true">TR</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
  <div class="brand">
    <img src="/logo.svg" alt="DEM CAFE logosu" width="64" height="64" class="brand-logo">
    <h1 class="brand-name" id="brand-name">DEM CAFE</h1>
    <p class="brand-slogan" id="brand-slogan">Her Yudumda Bir DEM</p>
  </div>
</header>

<div class="bar" id="bar">
  <label class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" inputmode="search" autocomplete="off" enterkeyhint="search" placeholder="Menüde ara…" aria-label="Menüde ara">
    <button type="button" class="search-clear" id="q-clear" aria-label="Aramayı temizle" hidden>×</button>
  </label>
  <nav class="chips" id="chips" aria-label="Kategoriler"></nav>
</div>

<main id="main" class="main">
  <noscript>{{NOSCRIPT}}</noscript>
</main>

<footer class="foot" id="foot"></footer>

<a class="wa" id="wa" href="#" target="_blank" rel="noopener" hidden aria-label="WhatsApp ile yazın">
  <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3Zm0 23.6c-2 0-3.9-.5-5.6-1.5l-.4-.2-3.9 1 1-3.8-.3-.4A10.6 10.6 0 1 1 16 26.6Zm5.8-7.9c-.3-.2-1.9-.9-2.2-1s-.5-.2-.7.2-.8 1-1 1.2-.4.2-.7.1a8.7 8.7 0 0 1-4.3-3.8c-.3-.6.3-.5.9-1.7.1-.2 0-.4 0-.5l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6a1.2 1.2 0 0 0-.9.4 3.6 3.6 0 0 0-1.1 2.7 6.3 6.3 0 0 0 1.3 3.3 14.4 14.4 0 0 0 5.5 4.9c2 .9 2.8.9 3.9.8a3.3 3.3 0 0 0 2.1-1.5 2.7 2.7 0 0 0 .2-1.5c-.1-.1-.3-.2-.7-.3Z"/></svg>
  <span id="wa-label">Bize yazın</span>
</a>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <article class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
    <button type="button" class="sheet-close" data-close aria-label="Kapat">×</button>
    <div class="sheet-grip" aria-hidden="true"></div>
    <div id="sheet-body"></div>
  </article>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
